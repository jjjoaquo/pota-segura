<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Pota Segura{% endblock %}</title>
<style>
:root {
  --ink: #152f29; --muted: #4c6059; --green: #185846;
  --line: #d9e2d9; --paper: #f6f7ef; --white: #fff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.55 system-ui, sans-serif; }
a { color: var(--green); text-underline-offset: .2em; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid #b65324; outline-offset: 3px;
}
header { background: var(--white); border-bottom: 1px solid var(--line); }
nav, main { width: min(100% - 2rem, 68rem); margin-inline: auto; }
nav { min-height: 4.4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
nav form { margin: 0; }
.brand { color: var(--ink); text-decoration: none; font-weight: 850; font-size: 1.3rem; letter-spacing: -.035em; }
.nav-action { border: 1px solid var(--line); border-radius: 999px; padding: .45rem .9rem; background: var(--white); color: var(--green); text-decoration: none; font-weight: 650; }
main { padding-block: clamp(1.5rem, 4vw, 3.25rem); }
h1, h2 { line-height: 1.12; letter-spacing: -.035em; }
h1 { font-size: clamp(2.15rem, 5vw, 4rem); margin: 0 0 1rem; }
h2 { font-size: 1.45rem; }
.panel, article, main > section:not(.hero):not(.results) {
  background: var(--white); border: 1px solid var(--line); border-radius: 1rem;
  padding: 1.25rem; margin-block: 1rem;
}
main > section h2:first-child, article h2:first-child, article h3:first-child { margin-top: 0; }
.hero { background: #123d32; color: #f6fbec; border-radius: 1.4rem; padding: clamp(1.35rem, 5vw, 3.8rem); }
.hero h1 { max-width: 15ch; }
.hero p { color: #deebdb; margin: 0 0 1.7rem; max-width: 55ch; }
.search { display: grid; grid-template-columns: 1.3fr 1fr auto; align-items: end; gap: .85rem; background: var(--white); color: var(--ink); border-radius: .85rem; padding: 1rem; }
label { display: block; margin-bottom: .3rem; font-size: .9rem; font-weight: 700; }
input:not([type=hidden]), select, textarea, button, .button {
  font: inherit; min-height: 2.75rem; border-radius: .55rem; padding: .55rem .8rem;
}
input:not([type=hidden]), select, textarea { width: 100%; border: 1px solid #a5b5aa; color: var(--ink); background: var(--white); }
button, .button { display: inline-block; background: var(--green); color: var(--white); border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; }
button:hover, .button:hover { filter: brightness(.92); }
nav .nav-action:hover { background: var(--paper); }
.results { margin-top: 2.25rem; }
.results h2 { font-size: 1.8rem; margin: 0 0 1rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
.cards article { margin: 0; }
.cards h3 { margin-bottom: .4rem; }
.cards p { margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.empty { border: 1px dashed #a5b5aa; border-radius: 1rem; padding: 1.5rem; background: #fbfcf7; }
.empty p { margin: 0; }
.field-form { max-width: 35rem; }
@media (max-width: 680px) {
  .search { grid-template-columns: 1fr; }
  .search button { width: 100%; }
}
</style>
</head>
<body>
<header><nav aria-label="Navegación principal">
<a class="brand" href="{% url 'lista' %}">Pota Segura</a>
{% if user.is_authenticated %}
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-action">Cerrar sesión</button></form>
{% else %}
<a class="nav-action" href="{% url 'login' %}">Iniciar sesión</a>
{% endif %}
</nav></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
