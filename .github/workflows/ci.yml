name: Validación y despliegue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Construir y validar configuración
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Ejecutar pruebas
        run: python manage.py test --verbosity 2
      - name: Analizar seguridad
        run: |
          python -m pip install bandit pip-audit
          bandit -r pota puestos -x puestos/tests.py
          pip-audit -r requirements.txt
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Configura el secreto RENDER_DEPLOY_HOOK."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --max-time 30 "$RENDER_DEPLOY_HOOK"
